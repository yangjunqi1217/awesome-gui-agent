name: README Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README structure
        run: |
          test -s README.md
          grep -q "## Table of Contents" README.md
          grep -q "### GUI Agent Surveys" README.md
          grep -q "### Video Demonstrations & Trajectories" README.md
          grep -q "img.shields.io" README.md
